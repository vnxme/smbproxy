name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # Also covers gofmt (as gofumpt) and go vet; see .golangci.yml.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: Module tidiness
        run: go mod tidy -diff
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    # Natively, with the race detector.
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...

  build:
    # Cross-compiles for every platform smbproxy supports, including those
    # without a hosted runner. On a tag, the binaries go to the release job.
    name: Build (all platforms)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      TARGETS: >-
        darwin/amd64 darwin/arm64
        linux/386 linux/amd64 linux/arm linux/arm64 linux/loong64
        linux/mips linux/mips64 linux/mips64le linux/mipsle
        linux/ppc64 linux/ppc64le linux/riscv64 linux/s390x
        windows/386 windows/amd64 windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile
        # Named and built as build.ps1 does: smbproxy_<os>_<arch>[.exe],
        # without build machine paths or debug information. A tag is
        # stamped in as the version; other builds report a pseudo-version
        # from git.
        run: |
          ldflags="-s -w"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ldflags="$ldflags -X main.version=$GITHUB_REF_NAME"
          fi
          mkdir dist
          failed=""
          for target in $TARGETS; do
            echo "::group::$target"
            goos=${target%/*} goarch=${target#*/}
            out=dist/smbproxy_${goos}_${goarch}
            [ "$goos" = windows ] && out=$out.exe
            if ! GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$ldflags" -o "$out" .; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed to build for:$failed"
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Upload binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    # A draft release for a pushed tag, once everything above has passed,
    # with the binaries attached. Publishing it is left to a person.
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the binaries on the existing release.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "$TAG" --generate-notes $prerelease
          fi
